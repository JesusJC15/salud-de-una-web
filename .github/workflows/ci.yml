name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Type Check, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run check:types

      - run: npm run fix:lint

      - run: npm run test

      - run: npm run build
        env:
          # Dummy values so Next.js build doesn't fail on missing env vars
          NEXT_PUBLIC_API_URL: https://placeholder.railway.app
          AUTH0_SECRET: placeholder-secret-for-build-only-not-real
          AUTH0_BASE_URL: https://placeholder.vercel.app
          AUTH0_ISSUER_BASE_URL: https://placeholder.us.auth0.com
          AUTH0_CLIENT_ID: placeholder
          AUTH0_CLIENT_SECRET: placeholder
