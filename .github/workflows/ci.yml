name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Type Check, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run check:types

      - run: npm run lint

      - run: npm run test

      - run: npm run build
        env:
          # Valores dummy para que next build no falle por vars faltantes.
          # Las vars reales se bakean en la imagen Docker durante CodeBuild (AWS).
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_AUTH0_DOMAIN: placeholder.auth0.com
          NEXT_PUBLIC_AUTH0_CLIENT_ID: placeholder
          NEXT_PUBLIC_AUTH0_AUDIENCE: https://api.salud-de-una.com
          NEXT_PUBLIC_AUTH0_REDIRECT_URI: http://localhost:3001/callback
