name: Deploy Web to AWS

# ─────────────────────────────────────────────────────────────────────────────
# Builds Next.js en GitHub Actions, sube a ECR y actualiza ECS.
# Las variables NEXT_PUBLIC_* se bakean en la imagen en build-time.
# Lee el ALB DNS de SSM automáticamente para no necesitar hardcodearlo.
#
# SECRETS (renovar cada sesión de Learner Lab, ~4 horas):
#   AWS_ACCESS_KEY_ID      → AWS Details → Show → Access Key
#   AWS_SECRET_ACCESS_KEY  → AWS Details → Show → Secret Key
#   AWS_SESSION_TOKEN      → AWS Details → Show → Session Token
#
# VARIABLES (configurar una sola vez, no expiran):
#   AWS_REGION          = us-east-1
#   ECS_CLUSTER         = salud-de-una-dev
#   AUTH0_DOMAIN        = salud-de-una.us.auth0.com
#   AUTH0_AUDIENCE      = https://api.salud-de-una.com
#   WEB_AUTH0_CLIENT_ID = <client_id_de_la_spa>
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build Next.js → ECR → ECS
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Leer ALB DNS desde SSM
        id: ssm
        env:
          REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          ALB_DNS=$(aws ssm get-parameter \
            --name "/salud-de-una/infra/alb-dns" \
            --query Parameter.Value \
            --output text \
            --region "$REGION")
          echo "alb_dns=$ALB_DNS" >> "$GITHUB_OUTPUT"
          echo "ALB DNS: $ALB_DNS"

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push imagen Next.js
        env:
          REGISTRY:    ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY:  salud-de-una/web
          IMAGE_TAG:   ${{ github.sha }}
          ALB_DNS:     ${{ steps.ssm.outputs.alb_dns }}
          AUTH0_DOMAIN:    ${{ vars.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ vars.WEB_AUTH0_CLIENT_ID }}
          AUTH0_AUDIENCE:  ${{ vars.AUTH0_AUDIENCE }}
        run: |
          SHORT_SHA="${IMAGE_TAG::7}"
          docker build --target runner \
            --build-arg NEXT_OUTPUT=standalone \
            --build-arg "NEXT_PUBLIC_API_BASE_URL=http://${ALB_DNS}/v1" \
            --build-arg "NEXT_PUBLIC_AUTH0_DOMAIN=${AUTH0_DOMAIN}" \
            --build-arg "NEXT_PUBLIC_AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}" \
            --build-arg "NEXT_PUBLIC_AUTH0_AUDIENCE=${AUTH0_AUDIENCE}" \
            --build-arg "NEXT_PUBLIC_AUTH0_REDIRECT_URI=http://${ALB_DNS}/callback" \
            -t "$REGISTRY/$REPOSITORY:$SHORT_SHA" \
            -t "$REGISTRY/$REPOSITORY:latest" \
            .
          docker push "$REGISTRY/$REPOSITORY:$SHORT_SHA"
          docker push "$REGISTRY/$REPOSITORY:latest"
          echo "✅ Imagen subida: $REGISTRY/$REPOSITORY:$SHORT_SHA"

      - name: Deploy a ECS (force new deployment)
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER || 'salud-de-una-dev' }}
          REGION:  ${{ vars.AWS_REGION  || 'us-east-1' }}
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "${CLUSTER}-web" \
            --force-new-deployment \
            --region "$REGION" \
            --no-cli-pager
          echo "✅ ECS web actualizando tasks."

      - name: Esperar estabilización ECS
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER || 'salud-de-una-dev' }}
          REGION:  ${{ vars.AWS_REGION  || 'us-east-1' }}
        run: |
          echo "Esperando que el web estabilice (máx 5 min)..."
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "${CLUSTER}-web" \
            --region "$REGION" || echo "WARN: timeout, puede seguir en proceso"
          echo "✅ Deploy completado."
