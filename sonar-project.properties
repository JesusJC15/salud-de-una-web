sonar.projectKey=JesusJC15_salud-de-una-web
sonar.organization=jesusjc15
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/**/__tests__/**,src/**/__test__/**,src/**/*.e2e-spec.ts

# Exclude generated files, build artifacts, and node_modules from all analysis
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**,src/types/api.generated.ts

# Exclude UI-layer code (components, pages, hooks) from coverage requirements.
# Root-level hooks are also excluded: they are React presentation hooks,
# equivalent in nature to src/features/**/hooks/** which are already excluded.
sonar.coverage.exclusions=src/components/**,src/app/**,src/hooks/**,src/features/**/components/**,src/features/**/pages/**,src/features/**/layouts/**,src/features/**/hooks/**,src/features/**/constants/**,src/providers/**

sonar.typescript.tsconfigPaths=tsconfig.json,tsconfig.jest.json

sonar.javascript.lcov.reportPaths=coverage/lcov.info
